# Codecov configuration.
#
# The cache-robustness tests (test/test_cache_robustness.py) deliberately
# exercise their scenarios in subprocesses: "HOME is unusable at interpreter
# startup" cannot be simulated in-process.  Coverage instrumentation only
# sees the main pytest process, so those paths can show as uncovered even
# though they are tested.  In-process twins keep the measured coverage of
# bib_lookup/_const.py and bib_lookup/citation_mixin.py at 100%; this file
# keeps the remaining subprocess-only assertions advisory instead of gating.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        informational: true
comment:
  layout: "header, diff, files"
  require_changes: false
