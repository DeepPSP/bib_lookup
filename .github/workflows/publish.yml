# This workflow will build a Python project using sdist bdist_wheel
# and publish to PyPI.

name: Publish

on:
  push:
    tags:
      - 'v*'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  ARTIFACT_NAME: bib_lookup_dist
  ARTIFACT_DIR: dist
  # OS_NAME_VERSION: ubuntu-22.04

jobs:
  build:
    # Don't run on forked repos.
    if: github.repository_owner == 'DeepPSP'

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0   # Use full history so hatch-vcs/git describe can see all tags
        fetch-tags: true # Ensure tags are available for versioning
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'
        cache: 'pip' # caching pip dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel build
        pip install -r requirements.txt
    - name: Install Hatch
      uses: pypa/hatch@install
    - name: Build
      run: |
        python -m build
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: dist

  github-release:
    # GitHub release: the release's CHANGELOG.rst section as the preamble,
    # GitHub's auto-generated "What's Changed" PR list appended (no labels
    # required), and the built distributions attached as assets.
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_DIR }}
      - name: Extract changelog section for this release
        run: |
          python3 - <<'PY'
          import os, re

          tag = os.environ["GITHUB_REF_NAME"]  # e.g. v0.3.0
          ver = tag.lstrip("v")
          text = open("CHANGELOG.rst", encoding="utf-8").read()
          pat = re.compile(r"^`(?P<v>\d[\w.]* <[^>]+>`__ - \d{4}-\d{2}-\d{2})\n-+\n", re.M)
          matches = list(pat.finditer(text))
          body = ""
          for i, m in enumerate(matches):
              if m.group("v").split(" <")[0] == ver:
                  start = m.end()
                  end = matches[i + 1].start() if i + 1 < len(matches) else len(text)
                  body = text[start:end].strip()
                  break
          if not body:
              body = "See [CHANGELOG.rst](https://github.com/DeepPSP/bib_lookup/blob/master/CHANGELOG.rst)."
          with open("release_notes.md", "w", encoding="utf-8") as f:
              f.write(f"# Changes in {tag}\n\n{body}\n")
          PY
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          generate_release_notes: true
          files: ${{ env.ARTIFACT_DIR }}/*

  pypi-publish:
    # publishing is separated from building
    needs: build
    name: Upload release to PyPI
    runs-on: ubuntu-22.04
    environment:
      name: release
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_DIR }}
      - name: Publish package to TestPyPI  # to test, use https://test.pypi.org/
        uses: pypa/gh-action-pypi-publish@release/v1
        # tolerate "file already exists" (e.g. when re-running the workflow
        # after a partial release), so the PyPI step still runs
        continue-on-error: true
        with:
          # trusted publishing (OIDC): the publisher registered on
          # test.pypi.org must match owner/repo/workflow/environment below
          repository-url: https://test.pypi.org/legacy/
          packages-dir: ${{ env.ARTIFACT_DIR }}
      - name: Remove attestations generated by the TestPyPI publish
        # the two publish steps share the same dist/ directory; the leftover
        # *.publish.attestation files would make the PyPI step fail with
        # "distributions already have publish attestations"
        run: rm -f ${{ env.ARTIFACT_DIR }}/*.publish.attestation
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # trusted publishing (OIDC): the publisher registered on pypi.org
          # must match owner/repo/workflow/environment below
          packages-dir: ${{ env.ARTIFACT_DIR }}

  docker-ghcr:
    # build & push the Streamlit app image to GHCR on version tags
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            SETUPTOOLS_SCM_PRETEND_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ghcr.io/deeppsp/bib_lookup-app:${{ github.ref_name }}
            ghcr.io/deeppsp/bib_lookup-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
